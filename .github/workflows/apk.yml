name: APK Android

on:
  push:
    branches: [main]
    paths:
      - index.html
      - android-src/**
      - scripts/**
      - package.json
      - capacitor.config.json
      - .github/workflows/apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Fabriquer l'APK
        run: bash scripts/build-android.sh

      - name: Garder l'APK dans les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sillon-apk
          path: sillon.apk

      - name: Publier la version à télécharger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          TITLE="Sillon pour Android (version 1.${{ github.run_number }})"
          NOTES="Télécharge sillon.apk sur ton téléphone Android et ouvre-le pour l'installer ou le mettre à jour. Tes réglages et ta discothèque sont conservés."
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk sillon.apk --clobber > log.txt 2>&1 && gh release edit apk --title "$TITLE" --notes "$NOTES" >> log.txt 2>&1
          else
            gh release create apk sillon.apk --title "$TITLE" --notes "$NOTES" > log.txt 2>&1
          fi
          rc=$?
          if [ $rc -ne 0 ]; then echo "::error::$(tr '\n' ' ' < log.txt)"; exit 1; fi
