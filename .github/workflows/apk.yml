name: APK Android

on:
  push:
    branches: [main]
    paths:
      - index.html
      - android-src/**
      - scripts/**
      - package.json
      - capacitor.config.json
      - .github/workflows/apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Fabriquer l'APK
        run: bash scripts/build-android.sh

      - name: Garder l'APK dans les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sillon-apk
          path: sillon.apk

      - name: Publier la version à télécharger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk sillon.apk \
            --title "Sillon pour Android (version 1.${{ github.run_number }})" \
            --notes "Télécharge sillon.apk sur ton téléphone Android et ouvre-le pour l'installer ou le mettre à jour. Tes réglages et ta discothèque sont conservés."
