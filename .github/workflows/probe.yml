name: Sonde (temporaire)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Sonde
        shell: bash
        run: |
          set +e
          exec > out.txt 2>&1
          sudo apt-get install -y -qq libchromaprint-tools ffmpeg >/dev/null 2>&1; which fpcalc
          mkdir p && cd p && npm init -y >/dev/null && npm i rusty-chromaprint-wasm@0.1.5 >/dev/null 2>&1
          D=node_modules/rusty-chromaprint-wasm/dist
          echo "===== d.ts"; cat $D/rusty_chromaprint_wasm.d.ts; echo "===== wasm.js"; cat $D/rusty_chromaprint_wasm.js; echo "===== bg.js head"; head -c 2500 $D/rusty_chromaprint_wasm_bg.js; echo; grep -n "^export function\|^export class\|__wbg_set_wasm" $D/rusty_chromaprint_wasm_bg.js | head -40
          # signal musical de test : 40 s
          ffmpeg -loglevel error -f lavfi -i "sine=f=220:d=40" -f lavfi -i "sine=f=330:d=40" -f lavfi -i "anoisesrc=d=40:a=0.05" -filter_complex "[0][1][2]amix=3,volume=3,aecho=0.8:0.8:300:0.4,tremolo=f=3" -ar 44100 -ac 2 t.wav
          ffmpeg -loglevel error -i t.wav -f s16le -ar 44100 -ac 2 t.raw
          echo "===== fpcalc"; fpcalc -raw t.wav | head -c 300; echo; fpcalc t.wav | head -c 200; echo
          cat > t.mjs <<'JS'
          import * as bg from './node_modules/rusty-chromaprint-wasm/dist/rusty_chromaprint_wasm_bg.js';
          import fs from 'fs';
          const bytes=fs.readFileSync('./node_modules/rusty-chromaprint-wasm/dist/rusty_chromaprint_wasm_bg.wasm');
          const {instance}=await WebAssembly.instantiate(bytes,{'./rusty_chromaprint_wasm_bg.js':bg});
          bg.__wbg_set_wasm(instance.exports); if(instance.exports.__wbindgen_start)instance.exports.__wbindgen_start();
          const raw=fs.readFileSync('t.raw');const s=new Int16Array(raw.buffer,raw.byteOffset,raw.length/2);
          const r=bg.fingerprintFromSamples(44100,2,s);
          console.log('RAW',Array.from(r.raw.slice(0,12)).join(','),'len',r.raw.length);
          console.log('COMP',r.compressed.slice(0,120));
          JS
          node t.mjs
          true
      - name: Publier le résultat
        run: |
          cd $RUNNER_TEMP && git init -q r && cd r && cp $GITHUB_WORKSPACE/out.txt . 2>/dev/null || cp ~/work/*/*/out.txt . 2>/dev/null || cp /home/runner/work/sillon/sillon/out.txt .
          git checkout -q -b probe-out && git add out.txt && git -c user.name=bot -c user.email=bot@x commit -qm sonde
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
